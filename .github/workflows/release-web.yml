name: Release web (Vercel)

# Deploys @notai/web to Vercel only when its version was bumped on `main`.
# Avoids redeploying on every push.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'

concurrency:
  group: release-web
  cancel-in-progress: false

jobs:
  detect:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.detect.outputs.bumped }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          node scripts/detect-version-bumps.mjs ${{ github.event.before }} ${{ github.sha }} > bumps.json
          cat bumps.json
          BUMPED=$(node -e "const b=require('./bumps.json'); process.stdout.write(b.web ? 'true' : 'false')")
          VERSION=$(node -e "const b=require('./bumps.json'); process.stdout.write(b.webVersion || '')")
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Vercel
    needs: detect
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production-web
      url: ${{ steps.vercel.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.13.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel project config
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build (Vercel)
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy
        id: vercel
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "✓ Deployed @notai/web v${{ needs.detect.outputs.version }} to $URL"

      - name: Tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="web-v${{ needs.detect.outputs.version }}"
          git tag "$TAG" "${{ github.sha }}"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-v${{ needs.detect.outputs.version }}
          name: '@notai/web v${{ needs.detect.outputs.version }}'
          body: |
            Web app deploy: ${{ steps.vercel.outputs.url }}

            See [CHANGELOG.md](./CHANGELOG.md) for details.
          generate_release_notes: true
