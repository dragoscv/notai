name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.13.1'
  TURBO_TELEMETRY_DISABLED: '1'
  TURBO_UI: 'false'
  FORCE_COLOR: '1'
  # Dummy values so `next build` can statically analyze; real values come
  # from Vercel / Cloud Run secrets at deploy time.
  DATABASE_URL: postgres://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret
  AUTH_TRUST_HOST: 'true'
  AUTH_GOOGLE_ID: ci
  AUTH_GOOGLE_SECRET: ci
  HOCUSPOCUS_JWT_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret
  NEXT_PUBLIC_HOCUSPOCUS_URL: ws://localhost:4040
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  install:
    name: Install + cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-lint-${{ runner.os }}-
      - run: pnpm lint

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-typecheck-${{ runner.os }}-
      - run: pnpm typecheck

  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache turbo + Next
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/web/.next/cache
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-
      - run: pnpm build

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  changelog:
    name: CHANGELOG check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify CHANGELOG entry on version bump
        run: |
          node scripts/detect-version-bumps.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > bumps.json
          cat bumps.json
          BUMPED=$(node -e "const b=require('./bumps.json'); process.stdout.write([b.web,b.realtime,b.desktop].some(Boolean) ? '1' : '0')")
          if [ "$BUMPED" = "1" ]; then
            VERSIONS=$(node -e "const b=require('./bumps.json'); const v=[]; if(b.web)v.push(b.webVersion); if(b.realtime)v.push(b.realtimeVersion); if(b.desktop)v.push(b.desktopVersion); process.stdout.write(v.join(' '))")
            echo "Detected version bumps for: $VERSIONS"
            for V in $VERSIONS; do
              if ! grep -q "$V" CHANGELOG.md; then
                echo "::error file=CHANGELOG.md::Version $V not mentioned in CHANGELOG.md"
                exit 1
              fi
            done
          else
            echo "No version bumps detected; skipping changelog check."
          fi
