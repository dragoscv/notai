name: CI

# Re-runs the same gate the pre-push hook enforces locally, so commits
# pushed with --no-verify still get caught before they merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy values — the build only needs them present, not real.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-32
      AUTH_TRUST_HOST: 'true'
      AUTH_GOOGLE_ID: ci
      AUTH_GOOGLE_SECRET: ci
      HOCUSPOCUS_JWT_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-32
      NEXT_PUBLIC_HOCUSPOCUS_URL: ws://localhost:4040
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SERWIST_SUPPRESS_TURBOPACK_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Build (web + realtime)
        run: pnpm build

      - name: Version bump audit
        if: github.event_name == 'pull_request'
        run: node scripts/version-bump-audit.mjs
