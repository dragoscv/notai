name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          # Build doesn't need real secrets — these are placeholders so
          # `t3-env` validation passes during `next build`.
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          NEXTAUTH_SECRET: ci-test-secret-please-rotate
          NEXTAUTH_URL: http://localhost:3000
        run: pnpm build
