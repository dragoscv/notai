name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          # `next build` collects page data which loads the env schema in
          # packages/lib/src/env.ts. CI doesn't have real secrets and
          # doesn't need them \u2014 we're only validating that the bundle
          # compiles. Skip env validation to keep CI hermetic.
          SKIP_ENV_VALIDATION: '1'
          SKIP_NEXT_BUILD_TS: '1'
          TURBO_DAEMON: '0'
        run: pnpm build
