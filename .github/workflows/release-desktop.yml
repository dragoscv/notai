name: Release desktop (Tauri)

# Builds Notai desktop installers for Windows, macOS (universal),
# and Linux (deb + AppImage) when apps/desktop/package.json is bumped
# on `main`. Also runnable manually.

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/package.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (else read from package.json)'
        required: false

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  detect:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.detect.outputs.bumped }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: detect
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/detect-version-bumps.mjs ${{ github.event.before }} ${{ github.sha }} > bumps.json
          cat bumps.json
          BUMPED=$(node -e "const b=require('./bumps.json'); process.stdout.write(b.desktop ? 'true' : 'false')")
          VERSION=$(node -e "const b=require('./bumps.json'); process.stdout.write(b.desktopVersion || '')")
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    needs: detect
    if: needs.detect.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-v${{ needs.detect.outputs.version }}
          name: 'Notai Desktop v${{ needs.detect.outputs.version }}'
          draft: true
          prerelease: false
          body: |
            See [CHANGELOG.md](./CHANGELOG.md).

            ### Downloads

            - **Windows**: `.msi` and `.exe` installers
            - **macOS**: universal `.dmg`
            - **Linux**: `.AppImage` and `.deb`
          generate_release_notes: true

  build-desktop:
    name: Build (${{ matrix.platform.target }})
    needs: [detect, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: macos-latest, target: 'macos-universal', args: '--target universal-apple-darwin' }
          - { os: ubuntu-22.04, target: 'linux-x86_64', args: '' }
          - { os: windows-2025, target: 'windows-x86_64', args: '' }
    runs-on: ${{ matrix.platform.os }}
    env:
      # Faster Cargo builds in CI: more parallel codegen units, no incremental
      # (pointless on cold caches), thinner debug info.
      CARGO_INCREMENTAL: '0'
      CARGO_NET_RETRY: '10'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short
      RUSTUP_MAX_RETRIES: '10'
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux deps (Ubuntu only)
        if: startsWith(matrix.platform.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            file

      - name: Install Rust (with universal-apple-darwin on macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # Share the cache across workflow runs even if Cargo.lock churns slightly.
          shared-key: tauri-${{ matrix.platform.target }}
          cache-on-failure: true
          # Persist target directory so incremental linker results survive too.
          cache-targets: true

      - uses: pnpm/action-setup@v6
        with:
          version: '10.13.1'
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      # Only install the desktop package + its (tiny) deps. The full monorepo
      # install pulls in Next.js, React, Drizzle, etc. — none of which Tauri
      # needs. This cuts install time from ~30s to ~5s.
      - name: Install desktop deps only
        run: pnpm install --frozen-lockfile --filter @notai/desktop

      - name: Sync Tauri version + production URL
        shell: bash
        env:
          WEB_URL: ${{ vars.WEB_PUBLIC_URL }}
        run: |
          node -e "
            const fs=require('fs');
            const path='./apps/desktop/src-tauri/tauri.conf.json';
            const p=JSON.parse(fs.readFileSync(path,'utf8'));
            const url=process.env.WEB_URL || 'https://notai.ro';
            p.version='${{ needs.detect.outputs.version }}';
            for (const w of (p.app && p.app.windows) || []) {
              if (typeof w.url === 'string') {
                w.url = w.url.replace(/^http:\/\/localhost:(3000|15600)/, url);
              }
            }
            fs.writeFileSync(path, JSON.stringify(p,null,2)+'\n');
            console.log('Wrote production config:', JSON.stringify({version:p.version, mainUrl:p.app.windows[0].url}, null, 2));
          "

      - name: Build + sign Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTAI_WEB_URL: ${{ vars.WEB_PUBLIC_URL || 'https://notai.ro' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.WEB_PUBLIC_URL || 'https://notai.ro' }}
          NEXT_PUBLIC_HOCUSPOCUS_URL: ${{ vars.HOCUSPOCUS_PUBLIC_URL || 'wss://realtime.notai.ro' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.platform.args }}

  publish-release:
    name: Publish release
    needs: [detect, create-release, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Rewrite the release body with direct download links to each
      # platform's primary asset, computed from the version. The asset
      # names produced by tauri-action are deterministic.
      - name: Write release notes with direct download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.detect.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/desktop-v${V}"
          notes=$(cat <<EOF
          See [CHANGELOG.md](./CHANGELOG.md) for what changed.

          ### Direct downloads

          | Platform | File |
          | --- | --- |
          | **Windows** (recommended) | [\`Notai_${V}_x64-setup.exe\`](${BASE}/Notai_${V}_x64-setup.exe) |
          | Windows (MSI) | [\`Notai_${V}_x64_en-US.msi\`](${BASE}/Notai_${V}_x64_en-US.msi) |
          | **macOS** (universal) | [\`Notai_${V}_universal.dmg\`](${BASE}/Notai_${V}_universal.dmg) |
          | **Linux** (AppImage) | [\`Notai_${V}_amd64.AppImage\`](${BASE}/Notai_${V}_amd64.AppImage) |
          | Linux (Debian/Ubuntu) | [\`Notai_${V}_amd64.deb\`](${BASE}/Notai_${V}_amd64.deb) |
          | Linux (RHEL/Fedora) | [\`Notai-${V}-1.x86_64.rpm\`](${BASE}/Notai-${V}-1.x86_64.rpm) |

          The Windows installer shows only a progress bar — no welcome page,
          no install location prompt, no finish page. Previous versions are
          uninstalled automatically and the app launches when install
          completes. Auto-updates use the same flow.

          See full [CHANGELOG](https://github.com/${REPO}/blob/main/CHANGELOG.md).
          EOF
          )
          gh release edit "desktop-v${V}" --notes "$notes"

      - name: Promote draft to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "desktop-v${{ needs.detect.outputs.version }}" --draft=false --latest

  publish-microsoft-store:
    name: Publish to Microsoft Store
    needs: [detect, build-desktop, publish-release]
    runs-on: windows-2025
    # Disabled: Microsoft Store publishing is intentionally turned off in CI
    # while we iterate on installer + auth flows. Re-enable by flipping this
    # back to `${{ needs.detect.outputs.bumped == 'true' }}`.
    if: false
    steps:
      - uses: actions/checkout@v5

      - name: Check Store credentials
        id: check
        shell: pwsh
        run: |
          if ('${{ secrets.MS_STORE_PRODUCT_ID }}' -and '${{ secrets.MS_STORE_TENANT_ID }}' -and '${{ secrets.MS_STORE_CLIENT_ID }}' -and '${{ secrets.MS_STORE_CLIENT_SECRET }}' -and '${{ secrets.MS_STORE_SELLER_ID }}') {
            "configured=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::notice::MS_STORE_* secrets not set; skipping Microsoft Store publish. See apps/desktop/store/README.md."
            "configured=false" >> $env:GITHUB_OUTPUT
          }

      - name: Configure Microsoft Store CLI
        if: steps.check.outputs.configured == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Reconfigure store credentials
        if: steps.check.outputs.configured == 'true'
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.MS_STORE_TENANT_ID }} `
            --sellerId ${{ secrets.MS_STORE_SELLER_ID }} `
            --clientId ${{ secrets.MS_STORE_CLIENT_ID }} `
            --clientSecret ${{ secrets.MS_STORE_CLIENT_SECRET }}

      - name: Update package URL in submission
        if: steps.check.outputs.configured == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
        run: |
          # The Store listing for an MSI/EXE app keeps a list of installer URLs
          # per installer type. We update the URL to the freshly-published
          # GitHub Release setup.exe and submit for certification.
          $url = "https://github.com/dragoscv/notai/releases/download/desktop-v$env:VERSION/Notai_${env:VERSION}_x64-setup.exe"
          Write-Host "Setting package URL to: $url"
          msstore submission update $env:PRODUCT_ID --packageUrl $url
          msstore submission publish $env:PRODUCT_ID

  microsoft-store-get-base-metadata:
    # Manually-triggered helper to print the live Store submission metadata
    # JSON. Use it once after the first manual submission to seed
    # apps/desktop/store/microsoft/metadata.json. See apps/desktop/store/README.md.
    name: 'Microsoft Store: get base metadata'
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version == '__msstore_get_metadata__'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: microsoft/microsoft-store-apppublisher@v1.1
      - shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.MS_STORE_TENANT_ID }} `
            --sellerId ${{ secrets.MS_STORE_SELLER_ID }} `
            --clientId ${{ secrets.MS_STORE_CLIENT_ID }} `
            --clientSecret ${{ secrets.MS_STORE_CLIENT_SECRET }}
          msstore submission get ${{ secrets.MS_STORE_PRODUCT_ID }}
