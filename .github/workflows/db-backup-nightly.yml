name: db-backup-nightly

# Nightly Postgres dump for disaster recovery.
#
# Trigger: every day at 02:30 UTC (~ 05:30 Bucharest in summer / 04:30 winter).
# Also runnable on demand via the Actions tab "Run workflow" button.
#
# Output:
#   1. Always: a workflow artifact `notai-db-backup-<timestamp>` retained
#      for 30 days. Download + restore via `scripts/restore-backup.mjs`.
#   2. If GCS_BACKUP_BUCKET + a `google-github-actions/auth` capable
#      `GCP_SA_KEY` secret are set: upload the same dump to gs://$bucket
#      under `notai/<YYYY>/<MM>/<DD>/notai-<timestamp>.dump` for
#      long-term retention with a lifecycle policy of your choice.
#
# Required secrets:
#   DATABASE_URL_PRODUCTION   pooled or direct production Postgres URL
#                             (use the *direct* URL — pooled URLs may
#                             refuse the binary copy protocol pg_dump uses)
#
# Optional secrets:
#   GCP_SA_KEY                JSON service-account key with
#                             roles/storage.objectCreator on the bucket
#   GCS_BACKUP_BUCKET         e.g. "notai-db-backups"
#
# Restore (locally):
#   node scripts/restore-backup.mjs --file=path/to/notai-<ts>.dump --target=local
#
# Cost: a single 200 MB compressed dump per day for 30 days ≈ 6 GB
# artifact storage; well inside the free GitHub plan for a small repo.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup-nightly
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump → artifact (+ optional GCS)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect optional GCS upload
        id: gcs
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCS_BACKUP_BUCKET: ${{ secrets.GCS_BACKUP_BUCKET }}
        run: |
          if [ -n "${GCP_SA_KEY:-}" ] && [ -n "${GCS_BACKUP_BUCKET:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install postgresql-client (matches Neon / Cloud SQL major)
        # pg_dump must be >= server version. Postgres 17 is the project
        # baseline (see docker/compose.yaml); the PGDG repo ships matching
        # client packages on every supported Ubuntu release.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Compute filename
        id: name
        run: |
          ts=$(date -u +'%Y%m%dT%H%M%SZ')
          echo "ts=$ts" >> "$GITHUB_OUTPUT"
          echo "file=notai-$ts.dump" >> "$GITHUB_OUTPUT"
          echo "ymd=$(date -u +'%Y/%m/%d')" >> "$GITHUB_OUTPUT"

      - name: Verify DATABASE_URL_PRODUCTION secret is set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL_PRODUCTION secret is not set; configure it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Mask just the password component in case anything echoes back.
          echo "::add-mask::$(echo "$DATABASE_URL" | sed -E 's#^[^:]+://[^:]+:([^@]+)@.*#\1#')"

      - name: pg_dump (custom format, compressed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          # --format=custom is the recommended format for pg_restore; it
          # is compressed by default and supports parallel restore.
          # --no-owner / --no-privileges keep the dump portable across
          # environments (different role names for staging restore).
          pg_dump \
            --format=custom \
            --no-owner \
            --no-privileges \
            --verbose \
            --file="${{ steps.name.outputs.file }}" \
            "$DATABASE_URL"
          ls -lh "${{ steps.name.outputs.file }}"

      - name: SHA-256 of dump
        run: sha256sum "${{ steps.name.outputs.file }}" | tee "${{ steps.name.outputs.file }}.sha256"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: notai-db-backup-${{ steps.name.outputs.ts }}
          path: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.file }}.sha256
          retention-days: 30
          if-no-files-found: error

      # ── Optional: upload to GCS for long-term retention ──
      - name: Authenticate to Google Cloud
        if: ${{ steps.gcs.outputs.enabled == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Upload to GCS
        if: ${{ steps.gcs.outputs.enabled == 'true' }}
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: ${{ steps.name.outputs.file }}
          destination: ${{ secrets.GCS_BACKUP_BUCKET }}/notai/${{ steps.name.outputs.ymd }}
          parent: false

      - name: Summary
        run: |
          {
            echo "## Backup ${{ steps.name.outputs.ts }}"
            echo ""
            echo "- File: \`${{ steps.name.outputs.file }}\`"
            echo "- SHA-256: \`$(cat ${{ steps.name.outputs.file }}.sha256 | awk '{print $1}')\`"
            echo "- Size: $(du -h ${{ steps.name.outputs.file }} | awk '{print $1}')"
            echo "- Artifact retention: 30 days"
            if [ "${{ steps.gcs.outputs.enabled }}" = "true" ]; then
              echo "- GCS: \`gs://${{ secrets.GCS_BACKUP_BUCKET }}/notai/${{ steps.name.outputs.ymd }}/${{ steps.name.outputs.file }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
