name: release-mobile-ios

# Builds and uploads the Notai iOS app to TestFlight.
#
# Triggers:
#   - Manually via workflow_dispatch
#   - Tag push matching `mobile-ios-v*`
#
# Required repository secrets:
#   APPLE_TEAM_ID                Your Apple developer team id (10-char)
#   IOS_BUNDLE_ID                e.g. com.notai.app
#   IOS_CERTIFICATE_BASE64       Distribution .p12 base64-encoded
#   IOS_CERTIFICATE_PASSWORD     Password for the .p12
#   IOS_PROVISIONING_PROFILE_BASE64  App Store provisioning profile base64
#   IOS_KEYCHAIN_PASSWORD        Random per-CI keychain password
#   APPSTORE_API_KEY_ID          App Store Connect API key id
#   APPSTORE_API_ISSUER_ID       Issuer id for the API key
#   APPSTORE_API_PRIVATE_KEY     Contents of the .p8 file (base64 or raw)
#
# Repo prerequisites:
#   - `apps/mobile/ios/` checked in (one-time bootstrap on a Mac via `cap add ios`)
#   - `apps/mobile/ios/App/App/Info.plist` contains the required usage strings
#   - The bundle id matches IOS_BUNDLE_ID

on:
  push:
    tags:
      - 'mobile-ios-v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'TestFlight release notes (optional)'
        required: false
        default: ''

concurrency:
  group: release-mobile-ios
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile web bundle
        working-directory: apps/mobile
        run: pnpm build

      - name: Capacitor sync (iOS)
        working-directory: apps/mobile
        run: npx cap sync ios

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH=$RUNNER_TEMP/notai-signing.keychain-db
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/notai_appstore.mobileprovision"

      - name: Archive .xcarchive
        working-directory: apps/mobile/ios/App
        env:
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Notai.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export .ipa
        env:
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>destination</key><string>export</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Notai.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          # Accept either base64 or raw .p8 contents.
          if echo "$APPSTORE_API_PRIVATE_KEY" | base64 --decode >/dev/null 2>&1; then
            echo "$APPSTORE_API_PRIVATE_KEY" | base64 --decode > "$KEY_PATH" || \
              echo "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          else
            echo "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          fi
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -n1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/notai-signing.keychain-db" || true
