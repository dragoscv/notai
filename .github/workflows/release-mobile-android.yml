name: release-mobile-android

# Builds + signs a release AAB and uploads it to the Google Play
# Console internal track.
#
# Triggers:
#   - Tag push matching `mobile-android-v*`
#   - Manual workflow_dispatch
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64        Base64 of the .jks keystore
#   ANDROID_KEYSTORE_PASSWORD      Keystore password
#   ANDROID_KEY_ALIAS              Key alias inside the keystore (e.g. "notai")
#   ANDROID_KEY_PASSWORD           Key password (often == keystore password)
#   PLAY_SERVICE_ACCOUNT_JSON      JSON for the Play Console service account
#   PLAY_PACKAGE_NAME              e.g. app.notai.mobile

on:
  push:
    tags:
      - 'mobile-android-v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to release to'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: release-mobile-android
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile web bundle
        working-directory: apps/mobile
        run: pnpm build

      - name: Capacitor sync (Android)
        working-directory: apps/mobile
        run: npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/notai-release.jks"

      - name: Build signed AAB
        working-directory: apps/mobile/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/notai-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            -PNOTAI_KEYSTORE_FILE="$KEYSTORE_PATH" \
            -PNOTAI_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PNOTAI_KEY_ALIAS="$KEY_ALIAS" \
            -PNOTAI_KEY_PASSWORD="$KEY_PASSWORD" \
            :app:bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: notai-android-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.PLAY_PACKAGE_NAME }}
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          changesNotSentForReview: false

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/notai-release.jks"
