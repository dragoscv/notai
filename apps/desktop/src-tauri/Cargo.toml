[package]
name = "notai-desktop"
version = "0.1.0"
description = "Notai — sticky notes for the desktop"
authors = ["Dragos"]
edition = "2021"

[lib]
name = "notai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-opener = "2.2"
tauri-plugin-window-state = "2.2"
tauri-plugin-single-instance = "2.2"
tauri-plugin-global-shortcut = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-deep-link = "2.2"
tauri-plugin-autostart = "2.2"
tauri-plugin-store = "2.2"
tauri-plugin-updater = "2.2"
tauri-plugin-process = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
