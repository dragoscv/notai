<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Clip to Notai</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <img src="icons/icon-32.png" alt="Notai" />
        <h1>Clip to Notai</h1>
      </header>
      <div id="status" class="status">Reading page…</div>
      <input id="title" type="text" placeholder="Title" />
      <textarea id="body" rows="3" placeholder="Optional notes / annotation"></textarea>
      <div class="row">
        <label class="check">
          <input type="checkbox" id="includeUrl" checked />
          Include URL
        </label>
        <select id="mode" title="Clip mode">
          <option value="article">Article (clean reader view)</option>
          <option value="selection">Selection only</option>
          <option value="page-screenshot">Page screenshot</option>
          <option value="region-screenshot">Region screenshot…</option>
        </select>
      </div>
      <div class="row">
        <button id="cancel" type="button" class="ghost">Cancel</button>
        <button id="save" type="button" class="primary">Save to Notai</button>
      </div>
      <p id="settings" class="muted">
        <a href="#" id="open-options">Settings</a>
      </p>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
