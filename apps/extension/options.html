<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Notai Clipper — Settings</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body style="width:480px">
    <div class="wrap">
      <header>
        <img src="icons/icon-32.png" alt="Notai" />
        <h1>Notai Clipper — Settings</h1>
      </header>
      <p class="status">
        The clipper sends pages to your Notai workspace via a personal token.
      </p>
      <label>API URL</label>
      <input id="apiBase" type="url" placeholder="https://notai.ro" />
      <label>Personal token</label>
      <input id="token" type="password" placeholder="notai_pat_…" />
      <p class="muted" style="text-align:left">
        Generate one in Notai → Settings → Integrations → Web clipper.
      </p>
      <div class="row">
        <button id="save" type="button" class="primary">Save</button>
        <button id="disconnect" type="button" class="ghost">Disconnect</button>
      </div>
      <p id="status" class="muted"></p>
    </div>
    <script src="options.js" type="module"></script>
  </body>
</html>
