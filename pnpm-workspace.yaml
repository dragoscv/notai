  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  next: ^16.0.0

  # --- Auth ---
  "next-auth": ^5.0.0-beta.25
  "@auth/drizzle-adapter": ^1.7.4

  # --- DB / ORM ---
